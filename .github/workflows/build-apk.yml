name: Build Android APK

# Runs on every push to main, or manually from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Each build gets a higher version (1.0.<build number>) so the in-app updater
      # knows it's newer and Android accepts it as an update.
      - name: Set version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          jq --arg v "$VERSION" --argjson c ${{ github.run_number }} \
            '.expo.version = $v | .expo.android.versionCode = $c' app.json > app.tmp.json
          mv app.tmp.json app.json
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install packages
        run: |
          npm install
          npx expo install --fix

      - name: Generate Android project
        run: npx expo prebuild --platform android

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Diagnose build failure
        if: failure()
        run: |
          npm ls expo expo-splash-screen @expo/vector-icons expo-modules-autolinking expo-modules-core --all 2>&1 | head -60 || true
          npx expo-modules-autolinking resolve --platform android --json > /tmp/al.json 2>&1 || true
          node -e "const j=require('/tmp/al.json'); j.modules.forEach((m,i)=>console.log(i, m.packageName, m.packageVersion, JSON.stringify(m.projects.map(p=>p.publication||null))))" || head -c 3000 /tmp/al.json

      - name: Rename APK
        run: mv android/app/build/outputs/apk/release/app-release.apk "budget-planner-${VERSION}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Budget Planner ${{ env.VERSION }}
          files: budget-planner-*.apk
          generate_release_notes: true
          make_latest: true
